[experiment]
name = "financial_long_horizon_ocr_v1"
seed = 2026
page_sizes = [1, 2, 5, 10, 20, 40]
windows_per_size = 3
render_dpi = 200
evidence_page_indexing = "zero_based"
numeric_relative_tolerance = 0.01

[splits]
development = "dev"
test = "test"

[retrieval]
k_values = [1, 3, 5]
chunking = "page"

[review]
target_evidence_recall = 0.95
risk_thresholds = [0.2, 0.4, 0.6, 0.8]

[outputs]
root = "results"
save_raw_model_output = true
save_normalized_output = true
save_page_scores = true

