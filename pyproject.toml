[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-ocr-research"
version = "0.2.0"
description = "Reproducible long-document financial OCR research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7"]

[project.scripts]
finocr = "finocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
